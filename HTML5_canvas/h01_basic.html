<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <canvas id="cv" width="300" height="400" style="border:1px solid red">

    </canvas>

    <script>
        $(function () {

            var paper = document.getElementById('cv')
            var pen = paper.getContext('2d')
            pen.fillRect(10, 20, 30, 40)
            pen.fillStyle = 'red'
            pen.fillRect(40, 60, 100, 50)

            $('#cv').mouseup(function (e) {
                console.log("zmfflr");
                pen.fillRect(e.pageX, e.pageY, 30, 30)
            })

        })


    </script>
</body>

</html>
