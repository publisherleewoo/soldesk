<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>1128</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>

    </style>
    <script>
        $(function () {
            // API KEY = NrUNiUV8RrElmIXMx4eO
            // ps = 012diLJrbj
            // 서버에서 Access-Control-Allow-Origin 셋팅을 안해놔서 cors 에러날때 해결방법은 Proxy 서버 구현

            var btn = $('button')

            btn.click(function () {
                $.ajax({
                    url: "http://127.0.0.1:8000/naver.shopping.get",
                    data: { "q": $("input").val() },
                    success: function (xData) {
                        $('table').empty();
                        $(xData).find('item').each(function (i, data) {

                            var title = $(data).find('title').text()
                            var img = $(data).find('image').text()
                            var mallName = $(data).find('mallName').text()
                            var price = $(data).find('lprice').text()
                            $('table').append('<tr>' + '<td>' + '<img width="100px"src=' + img + '>' + '</td>' + '<td>' + title + '</td>' + '<td>' + mallName + '</td>' + '<td>' + price + '원</td>' + '</tr>')
                        })


                    },
                    error: function (request, status, error) {


                    }

                })
            })

            $('input').keyup(function(e){
                // if(e.keyCode ==13){
                    btn.trigger('click')
                // }
            })


        })
    </script>
</head>

<body>
    <input value="가습기" />
    <button>버튼</button><br />
    <table border=1></table>
</body>

</html>
