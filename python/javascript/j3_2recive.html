<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        var p_name = urlParams.get('p_name')
        var p_price = urlParams.get('p_price')
        document.body.innerHTML = p_name+"<br>"

        document.body.innerHTML += p_price

    </script>
</body>

</html>
