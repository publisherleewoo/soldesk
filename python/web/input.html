</style>
<script>
    $(function () {
        var mail = 'naver.com'
        $('select').change(function (e) {
            mail = $(this).val()
            if (mail == '직접입력') {
                $('body').append('<input id="newIpt"/>');
                $('#newIpt').change(function () {
                    mail = $(this).val()
                })
            }else{
                $('#newIpt').remove()
            }
        })

        $("button").on('click', function () {
            alert($('input').val() + '@' + mail)
        })
    })
</script>

<body>

    이메일
    <input />@
    <select>
        <option>naver.com</option>
        <option>gmail.com</option>
        <option>직접입력</option>

    </select><br />
    <button>가입</button>
</body>
