<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            display: grid;
            height: 300px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-areas:
                'header header header'
                'menu article sidebar'
                'menu footer footer';
        }

        #container>div {
            border: 1px solid black;
        }

        .item1 {
            grid-area: header;
            background: green;
        }

        .item2 {
            grid-area: menu;
            background: blue;
        }

        .item3 {
            grid-area: article;
            background: pink;
        }

        .item4 {
            grid-area: sidebar;
            background: yellowgreen;
        }

        .item5 {
            grid-area: footer;
            background: brown;
        }
    </style>
</head>

<body>
    <h1>grid-template-areas</h1>
    <div id="container">
        <div class="item1">header</div>
        <div class="item2">menu</div>
        <div class="item3">article</div>
        <div class="item4">sidebar</div>
        <div class="item5">footer</div>

    </div>
</body>

</html>
