<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <form action="http://195.168.9.140:8888/member.sign.up" method="post">
        <h3>회원가입</h3>

        <label for="user_id">ID:</label>
        <input id="user_id" name="id" type="text" placeholder="영문/숫자만 입력">

        <label for="user_pw">PW:</label>
        <input id="user_pw" name="pw" type="password">

        <div class="radio-group">
            <span class="label-text">성별:</span>
            <label>
                <input name="gender" type="radio" value="남자">남자
            </label>
            <label>
                <input name="gender" type="radio" value="여자">여자
            </label>
            <label>
                <input name="gender" type="radio" value="기타">기타
            </label>
        </div>

        <label for="addr">주소:</label>
        <select name="addr" id="addr">
            <option value="서울">서울</option>
            <option value="경기">경기</option>
            <option value="강원">강원</option>
            <option value="충청">충청</option>
            <option value="기타">기타</option>
        </select>

        <label>취미:</label>
        <div class="checkbox-group">
            <label><input name="hobby" type="checkbox" value="독서">독서</label>
            <label><input name="hobby" type="checkbox" value="운동">운동</label>
            <label><input name="hobby" type="checkbox" value="잠">잠</label>
            <label><input name="hobby" type="checkbox" value="낚시">낚시</label>
            <label><input name="hobby" type="checkbox" value="코딩">코딩</label>
        </div>

        <label for="comment">자기소개</label>
        <textarea id="comment" name="comment">자기소개</textarea>
        <button type="submit">가입</button>
        <input type="image" src="./a.png" width="50px">

    </form>
</body>

</html>
